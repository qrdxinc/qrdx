name: Docs deploy

# Builds the docs site (apps/docs) on GitHub's runner and deploys the
# prebuilt output to its own Vercel project, whose Git deployments are off
# (apps/docs/vercel.json).
#
# production-deploy.yml runs it every 6 hours, after the main app's deploy,
# and it deploys main when a file the docs build reads (DOCS_INPUTS below)
# changed since the commit the docs site serves. Run by hand, it deploys
# the branch it's run from (production or a preview) without that check.
#
# Needs the repository variables DOCS_VERCEL_ORG_ID and DOCS_VERCEL_PROJECT_ID
# (the project's Settings → General), and the secret VERCEL_TOKEN. The
# project's Root Directory is apps/docs; its environment holds
# NEXT_PUBLIC_APP_URL, MAIN_ZONE_URL and the analytics ids
# (apps/docs/.env.example).
on:
  workflow_call:
    inputs:
      target:
        description: Vercel environment to deploy to
        type: string
        default: production
      only_if_changed:
        description: Deploy only when a file the docs build reads changed since the deployed commit
        type: boolean
        default: false
      ref:
        description: The commit to deploy (empty for the caller's)
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      target:
        description: Vercel environment to deploy to
        type: choice
        options:
          - production
          - preview
        default: production

permissions:
  contents: read

env:
  TARGET: ${{ inputs.target || 'production' }}
  VERCEL_ORG_ID: ${{ vars.DOCS_VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.DOCS_VERCEL_PROJECT_ID }}
  # Pinned so a CLI release can't change a deploy unannounced.
  VERCEL_CLI: vercel@65.15.0
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  decide:
    name: Decide whether to deploy the docs site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ONLY_IF_CHANGED: ${{ inputs.only_if_changed == true }}
          # The files the docs build reads, as git pathspecs (one "- " line
          # each; apps/app/tests/repo/docs-inputs.test.ts reads them too).
          DOCS_INPUTS: |
            # The docs site: its code, content (content/docs) and recorded dates
            - apps/docs/**
            - .github/workflows/docs-deploy.yml
            # The message catalogs, which stay with the main app's (the docs read
            # the English one)
            - apps/app/messages/**
            # The generated inputs' sources: the docs' message subset and the OpenAPI
            # document's copy (apps/docs/scripts/zone-inputs.mjs)
            - apps/app/scripts/i18n-docs-messages.ts
            - apps/app/lib/i18n/docs-messages.ts
            - apps/app/public/openapi.json
            - apps/app/scripts/openapi/export.ts
            # The product facts snapshot (apps/app/lib/product-facts.ts and what
            # it reads; turbo.json lists the same files for the docs' tasks)
            - apps/app/lib/product-facts.ts
            - apps/app/lib/product-facts-snapshot.ts
            - apps/app/scripts/facts-snapshot.ts
            - apps/app/lib/format-count.ts
            - apps/app/lib/pricing.ts
            - apps/app/lib/scan-history.ts
            - apps/app/lib/free-plan-limits.ts
            - apps/app/lib/plan-allowances.ts
            - apps/app/lib/path-alias-limits.ts
            - apps/app/lib/affiliates/terms.ts
            - apps/app/lib/invites/terms.ts
            - apps/app/lib/ai/art-models.ts
            - apps/app/lib/ai/models.ts
            - apps/app/lib/barcode/formats.ts
            - apps/app/lib/barcode/isbn-ranges.generated.ts
            - apps/app/lib/barcode/micro-qr.ts
            - apps/app/lib/barcode/publication.ts
            - apps/app/lib/brand-logos/catalog.generated.ts
            - apps/app/lib/landing/page-type-ids.ts
            - apps/app/ee/audit-log/limits.ts
            - apps/app/types/content-type-ids.ts
            - apps/app/types/qr-content.ts
            - apps/app/components/sections/ai-art/preset-meta.ts
            # The engine the docs' live examples render with, and the packages the
            # docs site imports
            - packages/qrdx/**
            - packages/availability/**
            - packages/analytics/**
            - packages/config/**
            - packages/design-system/**
            - packages/docs-assets/**
            - packages/i18n/**
            - packages/integrations/**
            - packages/next-config/**
            - packages/typescript-config/**
            - bun.lock
            - package.json
        run: |
          if [ "$ONLY_IF_CHANGED" != "true" ]; then
            echo "deploy=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          sha="$(git rev-parse HEAD)"
          live="$(curl --silent --show-error --fail-with-body --retry 3 \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" |
            jq -r '.targets.production.meta.githubCommitSha // empty')"
          inputs=()
          while IFS= read -r input; do inputs+=("$input"); done < <(sed -n 's/^- //p' <<<"$DOCS_INPUTS")
          if [ "$live" = "$sha" ]; then
            deploy=false
            reason="The docs site already serves ${sha:0:9}."
          elif [ -z "$live" ] || ! git merge-base --is-ancestor "$live" "$sha" 2>/dev/null; then
            deploy=true
            reason="Can't tell what changed since the docs site's deployment, so it deploys ${sha:0:9}."
          elif git diff --quiet "$live" "$sha" -- "${inputs[@]}"; then
            deploy=false
            reason="Nothing the docs build reads changed between ${live:0:9} and ${sha:0:9}."
          else
            deploy=true
            reason="Files the docs build reads changed between ${live:0:9} and ${sha:0:9}."
          fi
          echo "deploy=$deploy" >>"$GITHUB_OUTPUT"
          echo "$reason" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Build and deploy the docs site
    needs: decide
    if: needs.decide.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One deploy per target at a time: a newer one waits for the running one
    # instead of racing it.
    concurrency:
      group: docs-deploy-${{ inputs.target || 'production' }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      # Full history: each page's "Last updated" date and the sitemap's
      # lastmod come from git, and a shallow clone would date every page
      # to its oldest commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      # Bun installs the dependencies (the version pinned in package.json
      # "packageManager"); Node 22 runs the build.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Restore Bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Check the Vercel settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=()
          [ -n "$VERCEL_ORG_ID" ] || missing+=("variable DOCS_VERCEL_ORG_ID")
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=("variable DOCS_VERCEL_PROJECT_ID")
          [ -n "$VERCEL_TOKEN" ] || missing+=("secret VERCEL_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Set the repository ${missing[*]} to deploy the docs site."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The docs import the engine from packages/qrdx/dist.
      - name: Build qrdx
        run: bun run --filter qrdx build:inplace

      - name: Pull the project settings and environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bun x "$VERCEL_CLI" pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"

      # A production build stops when it can't read the main app's
      # /zone/availability.json (apps/docs/scripts/zone-inputs.mjs)
      # rather than hide every feature that needs setup.
      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DOCS_REQUIRE_AVAILABILITY: ${{ env.TARGET == 'production' && '1' || '0' }}
        run: |
          prod=()
          [ "$TARGET" = "production" ] && prod=(--prod)
          bun x "$VERCEL_CLI" build "${prod[@]}" --token="$VERCEL_TOKEN"

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          prod=()
          [ "$TARGET" = "production" ] && prod=(--prod)
          url="$(bun x "$VERCEL_CLI" deploy --prebuilt "${prod[@]}" --token="$VERCEL_TOKEN")"
          echo "Deployed the docs site ($TARGET): $url" | tee -a "$GITHUB_STEP_SUMMARY"

      # The first search on a new deployment builds the index and is slow;
      # the docs assistant and the search dialog shouldn't be the ones to
      # pay for it. A failure here doesn't fail the deploy.
      - name: Warm the search index
        if: env.TARGET == 'production'
        continue-on-error: true
        run: |
          curl --silent --show-error --max-time 60 --output /dev/null \
            --write-out "search: %{http_code} in %{time_total}s\n" \
            "https://docs.qrdx.dev/api/search?query=qr"
