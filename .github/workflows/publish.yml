# Publishes qrdx, @qrdx/cli and @qrdx/n8n-nodes-qrdx to npm from main with
# npm Trusted Publishing (OIDC). No npm token is stored anywhere: npm
# exchanges this run's GitHub OIDC token for a short-lived publish token and
# attaches a provenance statement on its own.
#
# The n8n nodes publish in their own job, so a problem there (no trusted
# publisher yet, say) never stops qrdx or @qrdx/cli. Re-run the workflow by
# hand once it's fixed: versions already on npm are skipped.
#
# One-time setup on npmjs.com, for each of qrdx, @qrdx/cli and
# @qrdx/n8n-nodes-qrdx:
#   Package → Settings → Trusted publishing → GitHub Actions
#     Organization or user: qrdxinc
#     Repository:           qrdx
#     Workflow filename:    publish.yml
#     Environment:          (leave empty)
#     Allowed actions:      npm publish
#
# Trusted publishing needs npm 11.5.1+ on Node 22.14+, so the job installs a
# pinned npm 11. Bun packs each package (bun pm pack), which turns the CLI's
# "qrdx": "workspace:*" into the exact qrdx version; npm then uploads the
# tarball. Publishing a tarball skips the packages' prepublishOnly scripts,
# so this job runs the same checks itself: build, tests and the README
# option lists. The CLI's tarball also gets an npm-shrinkwrap.json
# (scripts/shrinkwrap-cli.sh), so each CLI version installs one fixed
# dependency tree.
#
# A package is published only when the version in its package.json is not
# on npm yet, so a push that doesn't bump a version publishes nothing. qrdx
# goes first because the CLI depends on it.
name: Publish

on:
  push:
    branches:
      - main
    paths:
      - packages/qrdx/**
      - packages/cli/**
      - plugins/n8n/**
  workflow_dispatch:

# Never cancel a publish halfway; queue the next one instead.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Trusted publishing (OIDC) and provenance.
  id-token: write

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  publish:
    name: Publish to npm
    # Manual runs publish only from main too.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Bun installs and packs (the version pinned in package.json
      # "packageManager"); Node 22 and npm 11 build, test and publish.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # No dependency cache: npm recommends release builds start clean.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install npm 11 (trusted publishing needs 11.5.1+)
        run: |
          npm install -g npm@11.21.1
          echo "node $(node --version), npm $(npm --version)"

      # Only a 404 from npm means "not published yet"; any other npm error
      # (network, auth) stops the run instead of guessing.
      - name: Find unpublished versions
        id: versions
        run: |
          any=false
          for dir in qrdx cli; do
            name="$(node -p "require('./packages/$dir/package.json').name")"
            version="$(node -p "require('./packages/$dir/package.json').version")"
            # stdout holds only the version. npm and Node write notices and
            # warnings (a url.parse() DeprecationWarning, say) to stderr, and
            # mixing them in made every version look unpublished.
            errors="$RUNNER_TEMP/npm-view-errors.txt"
            if published="$(npm view "$name@$version" version 2>"$errors")"; then
              published="$(printf '%s' "$published" | tr -d '[:space:]')"
            elif grep -q E404 "$errors"; then
              published=""
            else
              echo "::error::Could not check $name@$version on npm: $(cat "$errors")"
              exit 1
            fi
            if [ "$published" = "$version" ]; then
              echo "$name@$version is already on npm, skipping." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "$dir=false" >> "$GITHUB_OUTPUT"
            else
              echo "$name@$version will be published." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "$dir=true" >> "$GITHUB_OUTPUT"
              any=true
            fi
          done
          echo "any=$any" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.versions.outputs.any == 'true'
        run: bun install --frozen-lockfile

      # The CLI and its tests consume qrdx from its dist/ output.
      - name: Build
        if: steps.versions.outputs.any == 'true'
        run: bun x turbo build --filter=qrdx --filter=@qrdx/cli

      - name: Test
        if: steps.versions.outputs.any == 'true'
        run: bun x turbo test --filter=qrdx --filter=@qrdx/cli

      # The check both packages' prepublishOnly scripts run: the option
      # lists in the qrdx and @qrdx/cli READMEs match the code.
      - name: Check README option lists
        if: steps.versions.outputs.any == 'true'
        run: node packages/qrdx/scripts/readme-catalogue.mjs --check

      - name: Pack
        if: steps.versions.outputs.any == 'true'
        id: pack
        run: |
          dest="$RUNNER_TEMP/npm-packs"
          mkdir -p "$dest"
          for dir in qrdx cli; do
            (cd "packages/$dir" && bun pm pack --destination "$dest" --quiet > /dev/null)
          done
          qrdx="$(ls "$dest"/qrdx-[0-9]*.tgz)"
          cli="$(ls "$dest"/qrdx-cli-[0-9]*.tgz)"
          echo "qrdx=$qrdx" >> "$GITHUB_OUTPUT"
          echo "cli=$cli" >> "$GITHUB_OUTPUT"
          # The packed CLI must depend on a real qrdx version, never workspace:.
          dep="$(tar -xOzf "$cli" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).dependencies.qrdx")"
          echo "@qrdx/cli depends on qrdx $dep" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$dep" in
            workspace:*|undefined|"") echo "::error::The packed @qrdx/cli still has qrdx \"$dep\"."; exit 1 ;;
          esac

      - name: Publish qrdx
        id: publish-qrdx
        if: steps.versions.outputs.qrdx == 'true'
        run: npm publish "${{ steps.pack.outputs.qrdx }}" --access public --provenance

      # `npx @qrdx/cli@<version>` pins the CLI but not the ^ ranges under it.
      # An npm-shrinkwrap.json in the tarball pins the whole tree: npm installs
      # exactly what it lists. It's made after qrdx is published because it
      # has to resolve the qrdx version the CLI depends on.
      - name: Add npm-shrinkwrap.json to @qrdx/cli
        if: steps.versions.outputs.cli == 'true'
        id: shrinkwrap
        run: |
          tarball="$(bash scripts/shrinkwrap-cli.sh "${{ steps.pack.outputs.cli }}" "$RUNNER_TEMP/npm-packs-shrinkwrapped")"
          echo "cli=$tarball" >> "$GITHUB_OUTPUT"
          pinned="$(tar -xOzf "$tarball" package/npm-shrinkwrap.json | node -p "Object.keys(JSON.parse(require('fs').readFileSync(0, 'utf8')).packages).filter(Boolean).length")"
          echo "@qrdx/cli ships an npm-shrinkwrap.json that pins $pinned packages." | tee -a "$GITHUB_STEP_SUMMARY"

      # npm repacked the tarball, so install it and draw a few codes before
      # it goes out.
      - name: Smoke-test the @qrdx/cli tarball
        if: steps.versions.outputs.cli == 'true'
        run: |
          dir="$RUNNER_TEMP/cli-smoke"
          mkdir -p "$dir"
          cd "$dir"
          npm init -y > /dev/null
          npm install "${{ steps.shrinkwrap.outputs.cli }}" --no-audit --no-fund
          for file in qr.svg qr.png qr.webp; do
            ./node_modules/.bin/qrdx generate "https://qrdx.dev" -o "$file"
          done

      - name: Publish @qrdx/cli
        id: publish-cli
        if: steps.versions.outputs.cli == 'true'
        run: npm publish "${{ steps.shrinkwrap.outputs.cli }}" --access public --provenance

      # "<package> <version> is on npm" in the QRdx Discord's #releases, for
      # each package this run published (scripts/discord-notify.mjs). It runs
      # when qrdx went out even if the CLI then failed. Without the
      # DISCORD_RELEASES_WEBHOOK_URL secret it's a notice, and it never fails
      # the publish.
      - name: Post to Discord
        if: ${{ !cancelled() && (steps.publish-qrdx.outcome == 'success' || steps.publish-cli.outcome == 'success') }}
        continue-on-error: true
        env:
          DISCORD_RELEASES_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
          QRDX_PUBLISHED: ${{ steps.publish-qrdx.outcome == 'success' }}
          CLI_PUBLISHED: ${{ steps.publish-cli.outcome == 'success' }}
        run: |
          dirs=()
          if [ "$QRDX_PUBLISHED" = "true" ]; then dirs+=(packages/qrdx); fi
          if [ "$CLI_PUBLISHED" = "true" ]; then dirs+=(packages/cli); fi
          node scripts/discord-notify.mjs npm "${dirs[@]}"

  publish-n8n:
    name: Publish @qrdx/n8n-nodes-qrdx to npm
    # Manual runs publish only from main too.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Bun installs and packs; Node 22 and npm 11 build, test and publish.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install npm 11 (trusted publishing needs 11.5.1+)
        run: |
          npm install -g npm@11.21.1
          echo "node $(node --version), npm $(npm --version)"

      - name: Find whether this version is published
        id: version
        run: |
          name="$(node -p "require('./plugins/n8n/package.json').name")"
          version="$(node -p "require('./plugins/n8n/package.json').version")"
          # stdout holds only the version. npm and Node write notices and
          # warnings (a url.parse() DeprecationWarning, say) to stderr, and
          # mixing them in made every version look unpublished.
          errors="$RUNNER_TEMP/npm-view-errors.txt"
          if published="$(npm view "$name@$version" version 2>"$errors")"; then
            published="$(printf '%s' "$published" | tr -d '[:space:]')"
          elif grep -q E404 "$errors"; then
            published=""
          else
            echo "::error::Could not check $name@$version on npm: $(cat "$errors")"
            exit 1
          fi
          if [ "$published" = "$version" ]; then
            echo "$name@$version is already on npm, skipping." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version will be published." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      # What the package's prepublishOnly runs (a packed tarball skips it).
      - name: Build, lint and test
        if: steps.version.outputs.publish == 'true'
        run: |
          bun run --filter @qrdx/n8n-nodes-qrdx build
          bun run --filter @qrdx/n8n-nodes-qrdx test

      - name: Pack
        if: steps.version.outputs.publish == 'true'
        id: pack
        run: |
          dest="$RUNNER_TEMP/npm-packs"
          mkdir -p "$dest"
          (cd plugins/n8n && bun pm pack --destination "$dest" --quiet > /dev/null)
          echo "tarball=$(ls "$dest"/qrdx-n8n-nodes-qrdx-[0-9]*.tgz)" >> "$GITHUB_OUTPUT"

      - name: Publish @qrdx/n8n-nodes-qrdx
        id: publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance

      # The QRdx Discord's #releases (scripts/discord-notify.mjs). Never
      # fails the publish.
      - name: Post to Discord
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          DISCORD_RELEASES_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
        run: node scripts/discord-notify.mjs npm plugins/n8n
