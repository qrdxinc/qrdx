name: Notify search engines

# After each production deploy of the main app (production-deploy.yml calls
# it once qrdx.dev serves the new build), tells IndexNow (Bing, Yandex,
# Seznam and the other IndexNow engines) and, when the BING_WEBMASTER_API_KEY
# secret is set, the Bing Webmaster API which sitemap URLs changed, and
# resubmits the sitemaps to Google Search Console when the
# GSC_SERVICE_ACCOUNT_JSON secret is set (scripts/notify-search-engines.mjs). "The sitemaps" are every one
# robots.txt lists, the marketing site's included. Google has no API to
# request indexing of ordinary pages; that stays a manual step in Search
# Console.
#
# Every day at 23:15 UTC, before Bing's quota resets at midnight:
# - the sweep sends what changed in the sitemaps since yesterday's run, from
#   a snapshot kept in the Actions cache. That catches the marketing site's
#   deploys, which don't run this workflow. Without yesterday's snapshot
#   (the first run, or after the cache dropped it), every URL goes to
#   IndexNow and the main pages to Bing, as for a deploy with no snapshot;
# - then the rest of the day's Bing quota goes to the backlog (--backlog):
#   that day's share of the priority pages (the main pages, the top
#   generators, every blog post and comparison; each once a week), then the
#   next slice of the rest of the sitemaps, so every page reaches the Bing
#   API every few days, including pages whose lastmod never changes.
#   Translations and community items go to IndexNow only.
# The repository is public, so these runs use no billed Actions minutes;
# the sweep adds a few seconds to the daily run.
#
# A search engine error never fails the run, and nothing here gates a merge
# or a deploy. Pull requests that change the script or this workflow run its
# read-only --check: the sitemaps, the important pages in them and a sample
# of each sitemap's pages, the IndexNow key file, the Bing key, the site's
# verification and today's quota, the Google service account's access to
# the property and when Google last read each sitemap. It fails when an
# important page is in no sitemap, when a sampled page answers anything but
# 200 (a redirect, a missing page), or when Bing or Google rejects the key or
# the site, so a broken setup shows before merging. It reads the live site,
# so it reports what production lists, not what the pull request changes.
on:
  workflow_call:
    inputs:
      after_deploy:
        description: Send what changed since the sitemap snapshot production-deploy.yml saved before the deploy (artifact sitemap-before)
        type: boolean
        default: false
  schedule:
    - cron: "15 23 * * *"
  pull_request:
    paths:
      - scripts/notify-search-engines.mjs
      - .github/workflows/notify-search-engines.yml
  workflow_dispatch:
    inputs:
      scope:
        description: "Which URLs to send (backlog: today's Bing slice; check: read-only setup check)"
        type: choice
        options:
          - important
          - all
          - urls
          - backlog
          - check
        default: important
      urls:
        description: "With scope urls: paths or URLs, separated by spaces or new lines"
        required: false

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    name: Check search engine setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/notify-search-engines.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Pull requests from forks get no secrets: the Bing and Google parts
      # then say "not set" and pass.
      - name: Check IndexNow, Bing and Google
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/notify-search-engines.mjs --check

  notify:
    if: github.event_name != 'pull_request'
    name: Notify search engines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Informational: a failure here never marks main red.
    continue-on-error: true
    concurrency:
      group: notify-search-engines
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/notify-search-engines.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The live sitemap as it was before the deploy, which the deploy
      # workflow saved before starting the build.
      - name: Download the sitemap from before the deploy
        if: inputs.after_deploy
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sitemap-before
          path: ${{ runner.temp }}

      # The daily sweep's baseline: the sitemaps as yesterday's run saved them.
      - name: Restore yesterday's sitemap snapshot
        if: github.event_name == 'schedule' && !inputs.after_deploy
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sitemap-sweep.xml
          key: sitemap-sweep-${{ github.run_id }}
          restore-keys: sitemap-sweep-

      - name: Notify search engines
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          AFTER_DEPLOY: ${{ inputs.after_deploy == true }}
          SCOPE: ${{ inputs.scope }}
          URLS: ${{ inputs.urls }}
        run: |
          set -f
          # Called by production-deploy.yml, whose event (schedule or
          # workflow_dispatch) this run reports as its own.
          if [ "$AFTER_DEPLOY" = "true" ]; then
            if [ -f "$RUNNER_TEMP/sitemap-before.xml" ]; then
              node scripts/notify-search-engines.mjs --changed-since "$RUNNER_TEMP/sitemap-before.xml"
            else
              echo "::notice::No sitemap from before the deploy; tonight's sweep sends what changed."
            fi
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            # Today's snapshot first, so a change that lands while this runs
            # is sent today and again tomorrow, never missed.
            sweep=".sitemap-sweep.xml"
            yesterday="$RUNNER_TEMP/sitemap-yesterday.xml"
            if [ -f "$sweep" ]; then mv "$sweep" "$yesterday"; fi
            node scripts/notify-search-engines.mjs --snapshot "$sweep"
            node scripts/notify-search-engines.mjs --changed-since "$yesterday"
            node scripts/notify-search-engines.mjs --backlog
          elif [ "$SCOPE" = "urls" ]; then
            printf '%s\n' $URLS > "$RUNNER_TEMP/urls.txt"
            node scripts/notify-search-engines.mjs --urls "$RUNNER_TEMP/urls.txt"
          else
            node scripts/notify-search-engines.mjs "--$SCOPE"
          fi

      # Tomorrow's baseline. A new key each run; the cache keeps the newest,
      # and drops entries nobody reads for 7 days.
      - name: Save today's sitemap snapshot
        if: github.event_name == 'schedule' && !inputs.after_deploy && hashFiles('.sitemap-sweep.xml') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sitemap-sweep.xml
          key: sitemap-sweep-${{ github.run_id }}
