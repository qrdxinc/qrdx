name: Discord

# Posts QRdx news to the QRdx Discord server through channel webhooks
# (scripts/discord-notify.mjs), after each production deploy of the main
# app (production-deploy.yml calls it with the commit production served
# before and the one it serves now, which can span several merges):
# - #announcements: each changelog entry the deploy adds
#   (apps/app/content/changelog/<slug>.mdx), with its title, description
#   and picture, linked to qrdx.dev/changelogs#<slug>. Editing an entry
#   posts nothing.
# - #releases: the pull requests the deploy brings to production, by
#   title, with links. Pull requests named chore:, ci:, build:, test: or deps: (or on
#   branches named that way), and ones that only change CI or tests, are
#   left out; a release with nothing else posts nothing.
# npm publishes (publish.yml) and MCP Registry publishes (mcp-registry.yml)
# post to #releases from their own workflows.
#
# The webhook URLs are the repository secrets
# DISCORD_ANNOUNCEMENTS_WEBHOOK_URL and DISCORD_RELEASES_WEBHOOK_URL
# (Discord: the channel's settings → Integrations → Webhooks → Copy Webhook
# URL). Without one, its post is a notice and the run passes.
#
# It runs once the deploy is live, so the changelog's picture loads when
# people open the post. A deploy that fails posts nothing; the next one
# posts its range, which includes the failed one's. A manual run prints the
# posts without sending them unless "Print only" is unticked.
#
# Nothing here gates a merge, a deploy or a publish: the job may fail
# without marking main red, and the script exits 0 on any Discord, GitHub
# or git error.
on:
  workflow_call:
    inputs:
      before:
        description: The commit production served before the deploy
        type: string
        required: true
      after:
        description: The commit production serves now
        type: string
        required: true
  workflow_dispatch:
    inputs:
      before:
        description: "Full SHA of the commit main was at before (the release merge's first parent)"
        required: true
      after:
        description: "Full SHA of the commit main moved to (empty: main's latest)"
        required: false
      dry_run:
        description: "Print only: show the posts without sending them"
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

jobs:
  post:
    name: Post to Discord
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Informational: a failure here never marks main red.
    continue-on-error: true
    # No concurrency group: each deploy posts its own range, and a group
    # would drop a queued run when a third came in.
    env:
      BEFORE: ${{ inputs.before }}
      AFTER: ${{ inputs.after || github.sha }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      # Only the script is checked out, and no file contents up front: the
      # script reads the few files it needs from git, which downloads them
      # then.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          filter: blob:none
          sparse-checkout: scripts/discord-notify.mjs
          sparse-checkout-cone-mode: false

      # Both ends of the deploy, so the script can tell a new changelog entry
      # from an edited one. Only these two commits, not the history between.
      - name: Fetch the two commits
        run: |
          for commit in "$BEFORE" "$AFTER"; do
            if [[ "$commit" =~ ^[0-9a-f]{40}$ && ! "$commit" =~ ^0+$ ]] && ! git cat-file -e "$commit^{commit}" 2> /dev/null; then
              git fetch --no-tags --depth=1 --filter=blob:none origin "$commit" || echo "::warning::Couldn't fetch $commit."
            fi
          done

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: "Post new changelog entries to #announcements"
        env:
          DISCORD_ANNOUNCEMENTS_WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK_URL }}
        run: |
          args=(changelog --before "$BEFORE" --after "$AFTER")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/discord-notify.mjs "${args[@]}"

      - name: "Post the release to #releases"
        if: ${{ !cancelled() }}
        env:
          DISCORD_RELEASES_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(release --before "$BEFORE" --after "$AFTER")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/discord-notify.mjs "${args[@]}"
