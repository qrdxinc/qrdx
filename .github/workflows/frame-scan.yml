name: Frame scan

# The full scan sweep over every official frame (packages/qrdx/src/frames/
# official). Pull request CI scans a sample (the hand-made frames, one frame
# per layout and a rotating set, packages/qrdx/scripts/official-frames/
# sample.mjs), which keeps it inside its time limit; this runs every frame
# through the engine's scan checks (zbar included) and the community
# publish gate:
# - on each release (a push to main that changes the frames),
# - weekly, and
# - by hand (Actions > Frame scan > Run workflow).
# The frames are split across the parallel jobs below: part i of n checks
# every n-th one (QRDX_FRAME_SCAN_PART, sample.mjs), so together they check
# every one. With about a thousand frames a single job took over
# 25 minutes, and the gate, then one test for all its frames, ran past its
# 5-minute limit (13 Nov 2026). Add a part when the library grows.
# It runs on GitHub's runners only; nothing here runs on Vercel.
on:
  push:
    branches:
      - main
    paths:
      - packages/qrdx/src/frames/**
      - packages/qrdx/scripts/official-frames/**
      - packages/qrdx/src/frame*.ts
      - packages/qrdx/src/frame*.tsx
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: frame-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Placeholders so env validation passes in the app's tests. Nothing in
  # this workflow connects to a database or any external service.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-for-anything-real
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1
  QRDX_FULL_FRAME_SCAN: 1

jobs:
  scan:
    name: Scan the official frames (part ${{ matrix.part }})
    runs-on: ubuntu-latest
    # A part took 4.5 to 7.6 minutes with 1,013 frames (14 Nov 2026; some
    # runners are twice as fast as others). This stops a hung job, not a
    # slow one; add a part before the slowest gets near it.
    timeout-minutes: 20
    strategy:
      # Every part runs to the end, so a run lists every frame that fails
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    env:
      QRDX_FRAME_SCAN_PART: ${{ matrix.part }}/${{ strategy.job-total }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # zbar reads every frame too, as it does on a developer's machine.
      - name: Install zbar
        run: sudo apt-get update && sudo apt-get install -y zbar-tools

      - name: Build qrdx
        id: build
        run: bun run --filter qrdx build:inplace

      - name: Engine scan checks, this part's frames
        working-directory: packages/qrdx
        run: bun x vitest run tests/official-frames tests/frame-label-markers.test.ts

      # The gate step below runs whatever the step before it found (once the
      # engine is built), so a failing frame never hides the others' results:
      # each step reports its own.
      - name: Publish gate, this part's frames
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: apps/app
        run: |
          bun x next typegen
          bun x vitest run tests/community/official-frames-gate-1.test.ts tests/community/official-frames-gate-2.test.ts tests/community/official-frames-gate-3.test.ts
