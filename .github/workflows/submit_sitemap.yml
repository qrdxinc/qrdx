name: Submit Sitemap to Google

on:
  workflow_run:
    workflows:
      - Publish Blog Article
    types:
      - completed
  workflow_dispatch:
    inputs:
      sitemap_url:
        description: "Override sitemap URL (optional)"
        required: false

permissions: {}

env:
  SITEMAP_URL: https://qrdx.dev/sitemap.xml
  SITE_URL: sc-domain:qrdx.dev

jobs:
  submit-sitemap:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: /tmp
        run: npm init -y && npm install googleapis google-auth-library

      - name: Publish Sitemap
        run: |
          cp .github/scripts/submit-sitemap.mjs /tmp/
          node /tmp/submit-sitemap.mjs
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          SITE_URL: ${{ env.SITE_URL }}
          SITEMAP_URL: ${{ inputs.sitemap_url || env.SITEMAP_URL }}
