name: Production deploy

# Deploys production on a timer instead of on every merge to main. Each
# deployment costs a Vercel build, about 1.6 GB of stored output and an empty
# page cache (the pages render and are written again), and main was getting
# about 8 merges a day, so production now deploys in batches (owner,
# 2026-11-26). apps/app/vercel.json turns off Vercel's Git deployments: a
# push to main deploys nothing by itself.
#
# Every 6 hours, or now with "Run workflow":
# 1. app: when main has moved past the commit qrdx.dev serves, asks Vercel to
#    build main's latest commit for production. It's the same build a push
#    used to start (Vercel clones the commit and runs
#    apps/app/scripts/skip-ci.js), and this job makes the same check first,
#    so a change Vercel would skip (the docs site alone, [skip ci]) starts
#    nothing. It waits for the build and fails when the build fails or
#    qrdx.dev doesn't switch to it.
# 2. docs: deploys the docs site when a file its build reads changed
#    (docs-deploy.yml), after the app, whose /zone/availability.json that
#    build reads.
# 3. After a new app deploy, now that it's live: the release goes to Discord
#    (discord-notify.yml) and the changed sitemap URLs to the search engines
#    (notify-search-engines.yml).
#
# Needs the secret VERCEL_TOKEN and the repository variables VERCEL_ORG_ID
# and APP_VERCEL_PROJECT_ID (the qrdx project's Settings → General). The
# repository is public, so these runs use no billed Actions minutes.
on:
  schedule:
    # 00:17, 06:17, 12:17 and 18:17 UTC (05:47, 11:47, 17:47 and 23:47 in
    # India). GitHub can start a scheduled run some minutes late.
    - cron: "17 */6 * * *"
  workflow_dispatch:

# One run at a time: a run that starts while another deploys waits for it.
concurrency:
  group: production-deploy
  cancel-in-progress: false

# What the called workflows need, too: theirs can't exceed these.
permissions:
  contents: read
  pull-requests: read

jobs:
  app:
    name: Deploy the main app
    # Forks have no Vercel project to deploy to.
    if: github.repository == 'qrdxinc/qrdx'
    runs-on: ubuntu-latest
    # The build takes 3 to 5 minutes; this leaves room for a queue.
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.decide.outputs.sha }}
      live: ${{ steps.decide.outputs.live }}
      deployed: ${{ steps.wait.outputs.deployed }}
    defaults:
      run:
        shell: bash
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.APP_VERCEL_PROJECT_ID }}
    steps:
      # main whatever branch "Run workflow" was started from. Full history:
      # the changes since the deployed commit decide whether to build.
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the Vercel settings
        run: |
          missing=()
          [ -n "$VERCEL_ORG_ID" ] || missing+=("variable VERCEL_ORG_ID")
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=("variable APP_VERCEL_PROJECT_ID")
          [ -n "$VERCEL_TOKEN" ] || missing+=("secret VERCEL_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Set the repository ${missing[*]} to deploy the main app."
            exit 1
          fi

      - name: Decide whether to deploy
        id: decide
        run: |
          vercel() {
            curl --silent --show-error --fail-with-body --retry 3 \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com$1"
          }
          sha="$(git rev-parse HEAD)"
          project="$(vercel "/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          live="$(jq -r '.targets.production.meta.githubCommitSha // empty' <<<"$project")"
          # A production build of this commit already under way: an earlier
          # run's, or a redeploy started from Vercel's dashboard.
          building="$(vercel "/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&limit=20" |
            jq -r --arg sha "$sha" '[.deployments[] | select(.meta.githubCommitSha == $sha and (.state == "QUEUED" or .state == "INITIALIZING" or .state == "BUILDING"))][0].uid // empty')"
          {
            echo "sha=$sha"
            echo "live=$live"
            echo "name=$(jq -r .name <<<"$project")"
          } >>"$GITHUB_OUTPUT"
          if [ "$live" = "$sha" ]; then
            reason="qrdx.dev already serves main (${sha:0:9})."
            action="none"
          elif [ -n "$building" ]; then
            reason="Vercel is already building main (${sha:0:9}) for production: $building."
            action="wait"
            echo "deployment=$building" >>"$GITHUB_OUTPUT"
          else
            # The files changed since the deployed commit, or null when
            # there's none or it isn't in main's history (the check then
            # builds).
            changed=null
            if [ -n "$live" ] && git merge-base --is-ancestor "$live" "$sha" 2>/dev/null; then
              changed="$(git diff --name-only "$live" "$sha" | jq --raw-input . | jq --slurp --compact-output .)"
            fi
            decision="$(MESSAGE="$(git log -1 --pretty=%B)" CHANGED="$changed" node --eval '
              const { shouldSkip } = require("./apps/app/scripts/skip-ci.js");
              const decision = shouldSkip({
                message: process.env.MESSAGE,
                env: "production",
                branch: "main",
                changedFiles: JSON.parse(process.env.CHANGED),
              });
              process.stdout.write(JSON.stringify(decision));
            ')"
            reason="$(jq -r .reason <<<"$decision")"
            if [ "$(jq -r .skip <<<"$decision")" = "true" ]; then
              action="none"
            else
              action="deploy"
              reason="main moved from ${live:0:9} to ${sha:0:9}. $reason"
            fi
          fi
          echo "action=$action" >>"$GITHUB_OUTPUT"
          echo "$reason" | tee -a "$GITHUB_STEP_SUMMARY"

      # The baseline for the search engines: until the new build is live,
      # the sitemaps are the current deployment's. Never holds up a deploy.
      - name: Save the live sitemap
        if: steps.decide.outputs.action == 'deploy'
        continue-on-error: true
        run: node scripts/notify-search-engines.mjs --snapshot "$RUNNER_TEMP/sitemap-before.xml"

      - name: Upload the live sitemap
        if: steps.decide.outputs.action == 'deploy'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-before
          path: ${{ runner.temp }}/sitemap-before.xml
          if-no-files-found: ignore
          retention-days: 1

      # No retries: a retried request could start a second build.
      - name: Start the production build
        id: start
        if: steps.decide.outputs.action == 'deploy'
        env:
          SHA: ${{ steps.decide.outputs.sha }}
          NAME: ${{ steps.decide.outputs.name }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          body="$(jq --null-input --compact-output \
            --arg name "$NAME" --arg project "$VERCEL_PROJECT_ID" --arg sha "$SHA" --argjson repo "$REPO_ID" \
            '{name: $name, project: $project, target: "production", gitSource: {type: "github", repoId: $repo, ref: "main", sha: $sha}}')"
          deployment="$(curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$body" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID")"
          echo "deployment=$(jq -r .id <<<"$deployment")" >>"$GITHUB_OUTPUT"
          echo "Started the production build of ${SHA:0:9}: $(jq -r .inspectorUrl <<<"$deployment")" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Wait for the build
        id: wait
        if: steps.start.outputs.deployment != '' || steps.decide.outputs.deployment != ''
        env:
          DEPLOYMENT: ${{ steps.start.outputs.deployment || steps.decide.outputs.deployment }}
          SHA: ${{ steps.decide.outputs.sha }}
        run: |
          vercel() {
            curl --silent --show-error --fail-with-body --retry 3 \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com$1"
          }
          while :; do
            sleep 20
            deployment="$(vercel "/v13/deployments/$DEPLOYMENT?teamId=$VERCEL_ORG_ID")" || continue
            state="$(jq -r .readyState <<<"$deployment")"
            case "$state" in
              READY) break ;;
              ERROR | CANCELED)
                echo "::error::The production build of ${SHA:0:9} ended in $state, so qrdx.dev still serves the previous deployment: $(jq -r .inspectorUrl <<<"$deployment")"
                exit 1
                ;;
            esac
          done
          # Vercel points the production domains at a ready production
          # build unless auto-assignment is off, which an Instant Rollback
          # does until a deployment is promoted.
          for _ in $(seq 1 12); do
            serving="$(vercel "/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" | jq -r '.targets.production.id // empty')" || serving=""
            if [ "$serving" = "$DEPLOYMENT" ]; then
              echo "deployed=true" >>"$GITHUB_OUTPUT"
              echo "qrdx.dev serves ${SHA:0:9} now." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The build of ${SHA:0:9} is ready, but qrdx.dev still serves another deployment: Vercel's automatic assignment of the production domains is off (an Instant Rollback turns it off). Promote it (vercel promote $DEPLOYMENT) to switch to it and turn assignment back on."
          exit 1

  docs:
    name: Docs
    needs: app
    # After the app, deployed or not, unless the run was cancelled.
    if: ${{ !cancelled() && github.repository == 'qrdxinc/qrdx' }}
    uses: ./.github/workflows/docs-deploy.yml
    with:
      only_if_changed: true
      ref: ${{ needs.app.outputs.sha }}
    secrets: inherit

  discord:
    name: Discord
    needs: app
    if: needs.app.outputs.deployed == 'true'
    uses: ./.github/workflows/discord-notify.yml
    with:
      before: ${{ needs.app.outputs.live }}
      after: ${{ needs.app.outputs.sha }}
    secrets: inherit

  search-engines:
    name: Search engines
    needs: app
    if: needs.app.outputs.deployed == 'true'
    uses: ./.github/workflows/notify-search-engines.yml
    with:
      after_deploy: true
    secrets: inherit
