name: Production deploy

# Deploys production on a timer instead of on every merge. Each deployment
# costs a Vercel build, stored output and an empty page cache (the pages
# render and are written again), and main was getting about 8 merges a day,
# so production deploys in batches (owner, 2026-11-26). Vercel's Git
# deployments are off (apps/app/vercel.json, and in qrdxinc/cloud
# apps/site/vercel.json and apps/console/vercel.json): a push deploys
# nothing by itself.
#
# Every 6 hours, or now with "Run workflow":
# 1. app: when main has moved past the commit qrdx.dev serves, asks Vercel to
#    build main's latest commit for production. It's the same build a push
#    used to start (Vercel clones the commit and runs
#    apps/app/scripts/skip-ci.js), and this job makes the same check first,
#    so a change Vercel would skip (the docs site alone, [skip ci]) starts
#    nothing. It waits for the build and fails when the build fails or
#    qrdx.dev doesn't switch to it.
# 2. cloud: the same for the marketing site and the console, which build from
#    the private qrdxinc/cloud. Only after the app: they compile the core at
#    the commit cloud pins, which must never be ahead of what qrdx.dev
#    serves.
# 3. docs: deploys the docs site when a file its build reads changed
#    (docs-deploy.yml), after the app, whose /zone/availability.json that
#    build reads.
# 4. After a new app deploy, now that it's live: the release goes to Discord
#    (discord-notify.yml) and the changed sitemap URLs to the search engines
#    (notify-search-engines.yml).
# The builds themselves go through .github/actions/vercel-production-build.
#
# Needs the secret VERCEL_TOKEN and the repository variables VERCEL_ORG_ID,
# APP_VERCEL_PROJECT_ID, SITE_VERCEL_PROJECT_ID and CONSOLE_VERCEL_PROJECT_ID
# (each project's Settings → General). The repository is public, so these
# runs use no billed Actions minutes.
on:
  schedule:
    # 00:17, 06:17, 12:17 and 18:17 UTC (05:47, 11:47, 17:47 and 23:47 in
    # India). GitHub can start a scheduled run some minutes late.
    - cron: "17 */6 * * *"
  workflow_dispatch:

# One run at a time: a run that starts while another deploys waits for it.
concurrency:
  group: production-deploy
  cancel-in-progress: false

# What the called workflows need, too: theirs can't exceed these.
permissions:
  contents: read
  pull-requests: read

jobs:
  app:
    name: Deploy the main app
    # Forks have no Vercel project to deploy to.
    if: github.repository == 'qrdxinc/qrdx'
    runs-on: ubuntu-latest
    # The build takes 3 to 5 minutes; this leaves room for a queue.
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.decide.outputs.sha }}
      live: ${{ steps.decide.outputs.live }}
      deployed: ${{ steps.build.outputs.deployed }}
    defaults:
      run:
        shell: bash
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.APP_VERCEL_PROJECT_ID }}
    steps:
      # main whatever branch "Run workflow" was started from. Full history:
      # the changes since the deployed commit decide whether to build.
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the Vercel settings
        run: |
          missing=()
          [ -n "$VERCEL_ORG_ID" ] || missing+=("variable VERCEL_ORG_ID")
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=("variable APP_VERCEL_PROJECT_ID")
          [ -n "$VERCEL_TOKEN" ] || missing+=("secret VERCEL_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Set the repository ${missing[*]} to deploy the main app."
            exit 1
          fi

      - name: Decide whether to deploy
        id: decide
        run: |
          sha="$(git rev-parse HEAD)"
          live="$(curl --silent --show-error --fail-with-body --retry 3 \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" |
            jq -r '.targets.production.meta.githubCommitSha // empty')"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "live=$live" >>"$GITHUB_OUTPUT"
          if [ "$live" = "$sha" ]; then
            reason="qrdx.dev already serves main (${sha:0:9})."
            action="none"
          else
            # The files changed since the deployed commit, or null when
            # there's none or it isn't in main's history (the check then
            # builds).
            changed=null
            if [ -n "$live" ] && git merge-base --is-ancestor "$live" "$sha" 2>/dev/null; then
              changed="$(git diff --name-only "$live" "$sha" | jq --raw-input . | jq --slurp --compact-output .)"
            fi
            decision="$(MESSAGE="$(git log -1 --pretty=%B)" CHANGED="$changed" node --eval '
              const { shouldSkip } = require("./apps/app/scripts/skip-ci.js");
              const decision = shouldSkip({
                message: process.env.MESSAGE,
                env: "production",
                branch: "main",
                changedFiles: JSON.parse(process.env.CHANGED),
              });
              process.stdout.write(JSON.stringify(decision));
            ')"
            reason="$(jq -r .reason <<<"$decision")"
            if [ "$(jq -r .skip <<<"$decision")" = "true" ]; then
              action="none"
            else
              action="deploy"
              reason="main moved from ${live:0:9} to ${sha:0:9}. $reason"
            fi
          fi
          echo "action=$action" >>"$GITHUB_OUTPUT"
          echo "$reason" | tee -a "$GITHUB_STEP_SUMMARY"

      # The baseline for the search engines: until the new build is live,
      # the sitemaps are the current deployment's. Never holds up a deploy.
      - name: Save the live sitemap
        if: steps.decide.outputs.action == 'deploy'
        continue-on-error: true
        run: node scripts/notify-search-engines.mjs --snapshot "$RUNNER_TEMP/sitemap-before.xml"

      - name: Upload the live sitemap
        if: steps.decide.outputs.action == 'deploy'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-before
          path: ${{ runner.temp }}/sitemap-before.xml
          if-no-files-found: ignore
          retention-days: 1

      - name: Build and deploy
        id: build
        if: steps.decide.outputs.action == 'deploy'
        uses: ./.github/actions/vercel-production-build
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          team: ${{ vars.VERCEL_ORG_ID }}
          project: ${{ vars.APP_VERCEL_PROJECT_ID }}
          repo-id: ${{ github.repository_id }}
          sha: ${{ steps.decide.outputs.sha }}
          label: qrdx.dev

  cloud:
    name: Deploy ${{ matrix.label }}
    needs: app
    # Only once the app is up to date: see 2. above.
    if: needs.app.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: the marketing site
            project-variable: SITE_VERCEL_PROJECT_ID
          - label: the console
            project-variable: CONSOLE_VERCEL_PROJECT_ID
    defaults:
      run:
        shell: bash
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars[matrix.project-variable] }}
      PROJECT_VARIABLE: ${{ matrix.project-variable }}
      LABEL: ${{ matrix.label }}
    steps:
      # Only this repository's build action. qrdxinc/cloud is private and
      # never checked out here: Vercel reads it through its GitHub app.
      - name: Checkout the build action
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions

      - name: Check the Vercel settings
        run: |
          missing=()
          [ -n "$VERCEL_ORG_ID" ] || missing+=("variable VERCEL_ORG_ID")
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=("variable $PROJECT_VARIABLE")
          [ -n "$VERCEL_TOKEN" ] || missing+=("secret VERCEL_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Set the repository ${missing[*]} to deploy $LABEL."
            exit 1
          fi

      # main's latest commit comes from Vercel, which reads the private
      # repository through its GitHub app: the endpoint the dashboard's
      # "Create Deployment" dialog uses (not in Vercel's API reference, so
      # this step fails loudly if it ever changes).
      - name: Decide whether to deploy
        id: decide
        run: |
          vercel() {
            curl --silent --show-error --fail-with-body --retry 3 \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com$1"
          }
          sha="$(vercel "/v1/integrations/git-commit-details/$VERCEL_PROJECT_ID?branchName=main&teamId=$VERCEL_ORG_ID" | jq -r '.commitSha // empty')"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Vercel didn't say which commit main is at for $LABEL."
            exit 1
          fi
          project="$(vercel "/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          live="$(jq -r '.targets.production.meta.githubCommitSha // empty' <<<"$project")"
          {
            echo "sha=$sha"
            echo "repo-id=$(jq -r .link.repoId <<<"$project")"
          } >>"$GITHUB_OUTPUT"
          if [ "$live" = "$sha" ]; then
            echo "action=none" >>"$GITHUB_OUTPUT"
            echo "Nothing to deploy: $LABEL already serves cloud's main (${sha:0:9})." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "action=deploy" >>"$GITHUB_OUTPUT"
            echo "Cloud's main moved from ${live:0:9} to ${sha:0:9}: building $LABEL." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build and deploy
        if: steps.decide.outputs.action == 'deploy'
        uses: ./.github/actions/vercel-production-build
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          team: ${{ vars.VERCEL_ORG_ID }}
          project: ${{ env.VERCEL_PROJECT_ID }}
          repo-id: ${{ steps.decide.outputs.repo-id }}
          sha: ${{ steps.decide.outputs.sha }}
          label: ${{ matrix.label }}

  docs:
    name: Docs
    needs: app
    # After the app, deployed or not, unless the run was cancelled.
    if: ${{ !cancelled() && github.repository == 'qrdxinc/qrdx' }}
    uses: ./.github/workflows/docs-deploy.yml
    with:
      only_if_changed: true
      ref: ${{ needs.app.outputs.sha }}
    secrets: inherit

  discord:
    name: Discord
    needs: app
    if: needs.app.outputs.deployed == 'true'
    uses: ./.github/workflows/discord-notify.yml
    with:
      before: ${{ needs.app.outputs.live }}
      after: ${{ needs.app.outputs.sha }}
    secrets: inherit

  search-engines:
    name: Search engines
    needs: app
    if: needs.app.outputs.deployed == 'true'
    uses: ./.github/workflows/notify-search-engines.yml
    with:
      after_deploy: true
    secrets: inherit
