name: CI

# One run per pull request (its required check) and one per push to staging
# and to main. Pull requests into staging test only what they change. Pushes
# to staging test everything in the background after each merge, so by the
# time staging is released the full suite has usually passed on that exact
# code. A release pull request (staging -> main) and the push to main it
# creates then reuse that result instead of testing the same tree again
# (scripts/ci-reuse-check.sh); if the staging run is still going they wait
# for it, and if nothing matches they run the full suite as before. A second
# job builds the main app alongside, on the same terms (see "build" below).
on:
  pull_request:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Lets scripts/ci-reuse-check.sh look up earlier runs of this workflow.
  actions: read

env:
  # Placeholders so env validation passes during type generation, tests and
  # the app build. Nothing in this workflow connects to a database or any
  # external service.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-for-anything-real
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Branch protection requires this exact check name on every pull request.
  check:
    name: Typecheck, test, lint
    runs-on: ubuntu-latest
    # The full suite took 17.8 and 18.9 minutes on 2026-11-10, with the Test
    # step at 15.5 and 16.7. A release run can first wait up to 20 minutes
    # for a staging run of the same code, so 45 still guards against a hung
    # job without cancelling a healthy one.
    timeout-minutes: 45
    # An explicit bash shell runs with -eo pipefail, so a failing command
    # piped into tee still fails its step.
    defaults:
      run:
        shell: bash
    steps:
      # Full history, so turbo --affected can compare with the PR's base.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Skips everything below when a full run of this exact tree already
      # passed (see the note at the top). Manual runs always test everything.
      - name: Reuse an earlier run of the same code
        id: reuse
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          # Release pull requests and pushes to main wait for a staging run
          # of the same code that's still going; other runs only take a
          # finished one.
          CI_REUSE_WAIT_SECONDS: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main')) && '1200' || '0' }}
        run: bash scripts/ci-reuse-check.sh

      # Bun installs the dependencies (the version pinned in package.json
      # "packageManager"); Node 22 runs the builds, tests and tools.
      - name: Setup Bun
        if: steps.reuse.outputs.hit != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node
        if: steps.reuse.outputs.hit != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Restore Bun cache
        if: steps.reuse.outputs.hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/native/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Turbo's local cache (builds, typechecks, test logs). A task whose
      # inputs haven't changed since a cached run replays its result instead
      # of running again. Runs on main save caches every pull request can
      # read; each run saves its own entry under its commit.
      - name: Restore turbo cache
        if: steps.reuse.outputs.hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            turbo-${{ runner.os }}-

      # apps/native sits outside the Bun workspace with its own bun.lock
      # (apps/native/README.md), so it installs on its own.
      - name: Install dependencies
        if: steps.reuse.outputs.hit != 'true'
        run: |
          bun install --frozen-lockfile
          (cd apps/native && bun install --frozen-lockfile)

      # The main app, CLI and CLI tests consume qrdx from its dist/ output,
      # and the CLI tests run the CLI's own dist/index.js.
      - name: Build qrdx and the CLI
        if: steps.reuse.outputs.hit != 'true'
        run: bun x turbo build --filter=qrdx --filter=@qrdx/cli 2>&1 | tee -a "$RUNNER_TEMP/turbo.log"

      # Whether this run checks the qrdx package (the two steps below). Same
      # scope as the app build below: a pull request into staging does when
      # it changes qrdx or a package qrdx uses (turbo --affected), or this
      # workflow; everything else always does.
      - name: Decide whether to check the qrdx package
        id: qrdx
        if: steps.reuse.outputs.hit != 'true'
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          AFFECTED: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' }}
        run: |
          check=true
          if [ "$AFFECTED" = "true" ]; then
            # Either command failing fails the step (bash -e), never skips the check.
            affected="$(bun x turbo ls --affected --output=json)"
            qrdx_affected="$(jq '.packages.items | any(.name == "qrdx")' <<<"$affected")"
            if [ "$qrdx_affected" != "true" ] && git diff --quiet "$TURBO_SCM_BASE"...HEAD -- .github/workflows/ci.yml; then
              echo "This pull request doesn't change qrdx, so its package isn't checked." | tee -a "$GITHUB_STEP_SUMMARY"
              check=false
            fi
          fi
          echo "check=$check" >>"$GITHUB_OUTPUT"

      # publint and are-the-types-wrong on the packed qrdx tarball
      # (packages/qrdx/scripts/check-package.mjs), so an entry or a build
      # change that breaks how Node, TypeScript or a bundler resolves the
      # package fails here instead of for the people who install it. The
      # check took 2.1 seconds on a laptop (2026-11-20).
      - name: Check the qrdx package
        if: steps.qrdx.outputs.check == 'true'
        run: bun run --filter qrdx check:package

      # The packed tarball installed with npm next to React 16.8, 17, 18 and
      # 19 (packages/qrdx/scripts/react-compat.mjs): each React renders the
      # same designs to the same markup and DOM as React 19, and a small app
      # type-checks against each one's @types/react. It needs the network
      # (npm) and took 8 seconds on a laptop with an empty npm cache, 5
      # with a warm one (2026-11-22).
      - name: Check qrdx on React 16.8, 17, 18 and 19
        if: steps.qrdx.outputs.check == 'true'
        run: bun run --filter qrdx check:react

      # The packed tarball installed with npm next to webpack 4 and the Babel
      # setup react-scripts 4.0.3 pins, and TypeScript 5.0 and 5.3
      # (packages/qrdx/scripts/legacy-compat.mjs): every entry builds with
      # react-scripts 4's webpack config, for old and new browsers, and draws
      # its code in a DOM, and a small app type-checks under each
      # moduleResolution. It needs the network (npm) and took 35 seconds on a
      # laptop with an empty npm cache, 12 with a warm one (2026-11-25).
      - name: Check qrdx on webpack 4 and TypeScript 5.0
        if: steps.qrdx.outputs.check == 'true'
        run: bun run --filter qrdx check:legacy

      # Turbo doesn't see apps/native (outside the workspace), so its
      # typecheck runs here too: a few seconds.
      - name: Typecheck packages
        if: steps.reuse.outputs.hit != 'true'
        run: |
          bun run typecheck 2>&1 | tee -a "$RUNNER_TEMP/turbo.log"
          (cd apps/native && bun run typecheck)

      - name: Typecheck the main app
        if: steps.reuse.outputs.hit != 'true'
        run: |
          (cd apps/app && bun x next typegen)
          bun run typecheck:app

      # Every translated catalog against English: keys, ICU arguments, numbers,
      # review status (apps/app/scripts/i18n-check.ts).
      - name: Check translations
        if: steps.reuse.outputs.hit != 'true'
        run: bun run --filter app i18n:check

      # Pull requests into staging test the packages they change and the
      # packages that depend on them. Release pull requests into main, pushes
      # to main and manual runs test everything. Branch protection requires
      # this job on every pull request; it passes when nothing is affected.
      - name: Test
        if: steps.reuse.outputs.hit != 'true'
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          AFFECTED: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' }}
        run: |
          set -o pipefail
          if [ "$AFFECTED" = "true" ]; then
            echo "Testing the packages this PR changes against $TURBO_SCM_BASE, and their dependents." | tee -a "$GITHUB_STEP_SUMMARY"
            bun x turbo test --affected 2>&1 | tee -a "$RUNNER_TEMP/turbo.log"
            # The main app's tests check its behaviour against the docs'
            # pages (apps/docs/content), which aren't its files, so
            # --affected leaves it out when only the pages change.
            if ! git diff --quiet "$TURBO_SCM_BASE"...HEAD -- apps/docs/content; then
              echo "The docs' pages changed: testing the main app against them too." | tee -a "$GITHUB_STEP_SUMMARY"
              bun x turbo test --filter=app 2>&1 | tee -a "$RUNNER_TEMP/turbo.log"
            fi
          else
            echo "Testing every package." | tee -a "$GITHUB_STEP_SUMMARY"
            bun x turbo test 2>&1 | tee -a "$RUNNER_TEMP/turbo.log"
          fi

      # Shows what came from the cache, so a pass that only replayed cached
      # results is visible.
      - name: Turbo cache report
        if: always() && steps.reuse.outputs.hit != 'true'
        run: |
          log="$RUNNER_TEMP/turbo.log"
          [ -f "$log" ] || exit 0
          hits="$(grep -c 'cache hit' "$log" || true)"
          misses="$(grep -c 'cache miss' "$log" || true)"
          {
            echo "### Turbo cache"
            echo "Replayed from cache: $hits task(s). Ran: $misses task(s)."
            echo
            echo '```'
            grep -E 'cache (hit|miss)' "$log" | sed -E 's/\x1b\[[0-9;]*m//g' | sed -E 's/^[[:space:]]*//' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Ultracite runs Biome (biome.jsonc) over the whole repo; findings show
      # as annotations on the pull request.
      - name: Lint (Ultracite)
        if: steps.reuse.outputs.hit != 'true'
        run: bun run lint:ci --reporter=github

  # `next build` of the main app (apps/app). The job above never builds it,
  # so a change could pass the typecheck, tests and lint and still fail the
  # build, which only the production deploy on Vercel would then find (and
  # keep the old version live): an export Next rejects, a client component
  # that imports server code, a page that can't be prerendered, an import
  # that only breaks when bundled. A job of its own, in parallel with the one
  # above, so the build adds no time to a run that's waiting on the tests:
  # on its first run (2026-11-17) this job took 2.1 minutes, 64 seconds of
  # them building, while the job above took 15.1.
  #
  # The whole `next build`, not `--experimental-build-mode compile`: compile
  # mode stops before Next collects page data and prerenders, so it lets a
  # page that can't be prerendered through. The build is offline and uses
  # placeholder settings (the env above):
  # - VERCEL=1 builds with the settings next.config.ts gives Vercel's build:
  #   no type check inside the build (tsc runs in the job above), no
  #   Turbopack build cache, no source maps. `next build` doesn't lint.
  # - QRDX_BUILD_WITHOUT_DATABASE=1, as in the Dockerfile: the pages that
  #   read the database while they render are rendered at request time
  #   instead (lib/build-without-database.ts). Vercel's build has the
  #   database and prerenders them.
  # - scripts/block-network.mjs fails every connection the build's Node
  #   processes try to make off the runner, so nothing reaches a database or
  #   an outside service. The pages that read GitHub's or npm's API while
  #   prerendering show their fallbacks; Vercel's build fetches the values.
  #   Turbopack (native code) still downloads the Google Fonts it compiles
  #   in, as on Vercel.
  #
  # Same scope as the tests: a pull request into staging builds the app when
  # it changes the app or a package the app uses (turbo --affected), or this
  # workflow or the network block; release pull requests, pushes and manual
  # runs always build, unless an earlier full run of the same code passed
  # (scripts/ci-reuse-check.sh, as above; a run passes only when both jobs
  # do). .next/cache isn't kept between runs: with Vercel's settings there's
  # no Turbopack cache in it to reuse.
  build:
    name: Build the main app
    runs-on: ubuntu-latest
    # Up to 20 minutes waiting for a staging run (as above), then the build.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reuse an earlier run of the same code
        id: reuse
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REUSE_WAIT_SECONDS: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main')) && '1200' || '0' }}
        run: bash scripts/ci-reuse-check.sh

      - name: Setup Bun
        if: steps.reuse.outputs.hit != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node
        if: steps.reuse.outputs.hit != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The job above saves this cache; this one only reads it.
      - name: Restore Bun cache
        if: steps.reuse.outputs.hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/native/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        if: steps.reuse.outputs.hit != 'true'
        run: bun install --frozen-lockfile

      - name: Decide whether to build
        id: scope
        if: steps.reuse.outputs.hit != 'true'
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          AFFECTED: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' }}
        run: |
          if [ "$AFFECTED" != "true" ]; then
            reason="Building the main app."
            build=true
          else
            # Either command failing fails the step (bash -e), never skips the build.
            affected="$(bun x turbo ls --affected --output=json)"
            app_affected="$(jq '.packages.items | any(.name == "app")' <<<"$affected")"
            if [ "$app_affected" = "true" ]; then
              reason="This pull request changes the main app or a package it uses, so the app is built."
              build=true
            elif ! git diff --quiet "$TURBO_SCM_BASE"...HEAD -- .github/workflows/ci.yml scripts/block-network.mjs; then
              reason="This pull request changes how the app is built, so the app is built."
              build=true
            else
              reason="This pull request changes nothing the main app uses, so there's nothing to build."
              build=false
            fi
          fi
          echo "$reason" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "build=$build" >>"$GITHUB_OUTPUT"

      - name: Build qrdx
        if: steps.scope.outputs.build == 'true'
        run: bun run --filter qrdx build:inplace

      - name: Build the main app
        if: steps.scope.outputs.build == 'true'
        working-directory: apps/app
        env:
          VERCEL: "1"
          QRDX_BUILD_WITHOUT_DATABASE: "1"
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/block-network.mjs
          BLOCK_NETWORK_LOG: ${{ runner.temp }}/network.log
        run: |
          # Memory in use on the runner, every 2 seconds, for the summary.
          (while sleep 2; do free -m | awk '/^Mem:/ { print $3 }'; done) >"$RUNNER_TEMP/memory.log" &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          bun x next build

      - name: Build report
        if: always() && steps.scope.outputs.build == 'true'
        env:
          BLOCK_NETWORK_LOG: ${{ runner.temp }}/network.log
        run: |
          {
            echo "### Main app build"
            if [ -s "$RUNNER_TEMP/memory.log" ]; then
              peak="$(sort -n "$RUNNER_TEMP/memory.log" | tail -1)"
              total="$(free -m | awk '/^Mem:/ { print $2 }')"
              echo "Peak memory in use on the runner during the build: ${peak} MB of ${total} MB."
            fi
            if grep -q ' blocked ' "$BLOCK_NETWORK_LOG" 2>/dev/null; then
              echo
              echo "Connections the build tried to make off the runner, all blocked (scripts/block-network.mjs):"
              echo '```'
              awk '$2 == "blocked" { print $3 }' "$BLOCK_NETWORK_LOG" | sort | uniq -c
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
